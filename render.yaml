services:
  - type: web
    name: n8n-vaccine-workflow
    env: docker                # ✅ ใช้ env: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    region: singapore
    branch: main
    autoDeploy: true

    # health check ของ n8n
    healthCheckPath: /healthz

    envVars:
      # ====== พื้นฐาน n8n ======
      - key: N8N_HOST
        value: 0.0.0.0
      - key: N8N_PORT
        value: "5678"
      - key: N8N_PROTOCOL
        value: https
      - key: WEBHOOK_URL
        value: https://firstprojecthome.onrender.com/   # ← ใส่โดเมนจริงของ service นี้

      # (แนะนำ) ปิด diagnostics/notifications ในโปรดักชัน
      - key: N8N_DIAGNOSTICS_ENABLED
        value: "false"
      - key: N8N_VERSION_NOTIFICATIONS_ENABLED
        value: "false"

      # ====== CORS (ถ้ายิงจากเว็บภายนอกอย่าง Netlify) ======
      - key: N8N_DEFAULT_CORS
        value: "true"
      - key: N8N_CORS_ALLOW_ORIGIN
        value: https://vaccinesystem.netlify.app

      # ====== Database (ตัวอย่าง: Render Managed Postgres) ======
      - key: DB_TYPE
        value: postgresdb
      - key: DB_POSTGRESDB_HOST
        fromDatabase:
          name: n8n-postgres
          property: host
      - key: DB_POSTGRESDB_PORT
        fromDatabase:
          name: n8n-postgres
          property: port
      - key: DB_POSTGRESDB_DATABASE
        fromDatabase:
          name: n8n-postgres
          property: database
      - key: DB_POSTGRESDB_USER
        fromDatabase:
          name: n8n-postgres
          property: user
      - key: DB_POSTGRESDB_PASSWORD
        fromDatabase:
          name: n8n-postgres
          property: password
      - key: DB_POSTGRESDB_SCHEMA
        value: public

databases:
  - name: n8n-postgres
    databaseName: n8n_db
    user: n8n_user
    plan: starter
    region: singapore
