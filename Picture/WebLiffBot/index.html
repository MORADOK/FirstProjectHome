<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <title>ลงทะเบียนผู้ป่วย</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      padding: 20px;
      text-align: center;
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
    }
    .container {
      max-width: 400px;
      margin: 50px auto 0 auto;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 2px 8px #0002;
      padding: 24px 16px 32px 16px;
    }
    h2 {
      margin-top: 0;
      font-weight: bold;
      color: #4CAF50;
    }
    input[type="text"] {
      width: 100%;
      height: 48px;
      font-size: 18px;
      padding: 10px;
      margin-bottom: 22px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }
    button {
      width: 100%;
      height: 48px;
      font-size: 18px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.15s;
    }
    button:active {
      background: #388e3c;
    }
    /* Custom Toast Modal */
    #toast {
      display: none;
      position: fixed;
      z-index: 9999;
      left: 0; right: 0;
      top: 0; bottom: 0;
      background: rgba(0,0,0,0.30);
      align-items: center;
      justify-content: center;
    }
    #toast .modal-content {
      background: #fff;
      padding: 32px 24px;
      border-radius: 18px;
      box-shadow: 0 2px 10px #0002;
      text-align: center;
      font-size: 20px;
      color: #388e3c;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>ลงทะเบียนผู้ป่วย</h2>
    <input type="text" id="name" placeholder="ชื่อ-นามสกุล">
    <button onclick="submitForm()">ลงทะเบียน</button>
  </div>
  
  <!-- Toast/Modal -->
  <div id="toast">
    <div class="modal-content">
      <div style="font-size:40px; margin-bottom:12px;">✅</div>
      <div>ลงทะเบียนสำเร็จ</div>
    </div>
  </div>

  <script>
    function showToast(msg, delay = 1800) {
      const toast = document.getElementById('toast');
      toast.querySelector('.modal-content div:last-child').textContent = msg || "ลงทะเบียนสำเร็จ";
      toast.style.display = 'flex';
      setTimeout(() => {
        toast.style.display = 'none';
        liff.closeWindow();
      }, delay);
    }

    async function submitForm() {
      try {
        await liff.init({ liffId: "2007564406-DNQKZNnq" });
        if (!liff.isInClient()) {
          alert("กรุณาเปิดผ่านแอป LINE เท่านั้น");
          liff.closeWindow();
          return;
        }
        const name = document.getElementById("name").value.trim();
        if (!name) {
          alert("กรุณากรอกชื่อก่อนลงทะเบียน");
          return;
        }
        const profile = await liff.getProfile();
        const resp = await fetch('https://firstprojecthome.onrender.com/webhook-test/Webhook-Vaccine', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            action: "register",
            lineUserId: profile.userId,
            patientName: name
          })
        });
        if (resp.ok) {
          showToast("ลงทะเบียนสำเร็จ");
        } else {
          alert("เกิดข้อผิดพลาด กรุณาลองใหม่");
        }
      } catch (err) {
        console.error("เกิดข้อผิดพลาด:", err);
        alert("เกิดข้อผิดพลาดในการลงทะเบียน กรุณาลองใหม่");
      }
    }
  </script>
</body>
</html>
